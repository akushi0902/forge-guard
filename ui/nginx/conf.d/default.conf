upstream forgeguard_backend {
    server forgeguard-backend:8000;
    keepalive 16;
}

# --------------------------------------------------------------------------
# HTTP → HTTPS redirect
# --------------------------------------------------------------------------
server {
    listen      80;
    server_name _;

    return 301 https://$host$request_uri;
}

# --------------------------------------------------------------------------
# HTTPS — TLS termination, security headers, API proxy, SPA routing
# --------------------------------------------------------------------------
server {
    listen      443 ssl;
    http2       on;
    server_name _;

    # ---- TLS ----------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Security headers (server-level default) ----------------------------
    # Location blocks that add their own add_header directives MUST include
    # snippets/security-headers.conf to avoid losing these headers.
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;

    # ---- Health check -------------------------------------------------------
    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain always;
        # Security headers not needed on the health endpoint but included for
        # consistency — health is internal-only but the scanner checks all paths.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- Backend API proxy --------------------------------------------------
    location /api/ {
        proxy_pass         http://forgeguard_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket upgrade support (future-proof)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;

        # Serve a clean JSON error page instead of Nginx's default for 5xx
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    location @backend_unavailable {
        internal;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 502 '{"error":"backend_unavailable","message":"The ForgeGuard backend is temporarily unavailable — please try again shortly."}';
    }

    # ---- Hashed static assets (Vite output) ---------------------------------
    # Vite appends a content hash to filenames (e.g. main.abc123.js).
    # These are safe to cache for one year — cache busting is handled by the hash.
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---- React SPA fallback -------------------------------------------------
    # All non-asset requests serve index.html so React Router handles routing.
    # Deep routes (e.g. /services/uuid/findings) must return index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}

# Security headers — included in every context that uses add_header.
#
# Nginx add_header inheritance rule: if a child block (location) has ANY
# add_header directive, ALL parent add_header directives are ignored for that
# block. This snippet is included wherever cache-control headers are set so
# security headers are never accidentally dropped.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header X-XSS-Protection          "0" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

# SonarQube / SonarCloud project configuration for ForgeGuard
#
# Usage:
#   sonar-scanner -Dsonar.host.url=https://sonar.example.com \
#                 -Dsonar.token=$SONAR_TOKEN
#
# Coverage report is generated by the CI pipeline before this scan runs:
#   cd backend && pytest --cov --cov-report=xml -q

# ── Project identification ──────────────────────────────────────────────── #
sonar.projectKey=forgeguard
sonar.projectName=ForgeGuard
sonar.projectVersion=1.0

# Organization (for SonarCloud — remove if using self-hosted SonarQube).
# sonar.organization=your-org-key

# ── Source and test directories ─────────────────────────────────────────── #
sonar.sources=backend/src,ui/src
sonar.tests=backend/tests,ui/src/__tests__,ui/src/test

# ── Language-specific settings ──────────────────────────────────────────── #
# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# TypeScript / JavaScript
sonar.javascript.lcov.reportPaths=ui/coverage/lcov.info

# ── Exclusions ──────────────────────────────────────────────────────────── #
sonar.exclusions=\
  **/alembic/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.venv/**,\
  **/coverage/**,\
  **/htmlcov/**,\
  **/*.min.js,\
  **/test-utils.tsx,\
  **/vitest.config.ts

sonar.test.exclusions=\
  backend/tests/factories/**,\
  ui/src/test/fixtures/**

# ── Quality gate ────────────────────────────────────────────────────────── #
# The quality gate enforced in CI requires:
#   - New code coverage >= 80%
#   - No new critical or blocker issues
# These thresholds are configured in the SonarQube server under Quality Gates.
# The pipeline blocks on a failed quality gate (scan:sonarqube on_failure: block).

# ── Encoding ────────────────────────────────────────────────────────────── #
sonar.sourceEncoding=UTF-8

name: Bootstrap ui/package-lock.json

# One-time helper — generates a real, registry-verified ui/package-lock.json
# and opens a PR with it. Run this once from the Actions tab, review and
# merge the PR, then this workflow is no longer needed.
#
# Usage: Actions tab → "Bootstrap ui/package-lock.json" → Run workflow

on:
  workflow_dispatch: {}

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate package-lock.json
        working-directory: ui
        run: npm install --package-lock-only

      - name: Verify lockfile was created
        run: |
          set -euo pipefail
          if [ ! -f ui/package-lock.json ]; then
            echo "✗ package-lock.json was not generated."
            exit 1
          fi
          echo "✓ ui/package-lock.json generated ($(wc -l < ui/package-lock.json) lines)."

      - name: Open PR with the lockfile
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: add ui/package-lock.json for reproducible builds"
          title: "chore: add missing ui/package-lock.json"
          body: |
            Auto-generated by the **Bootstrap ui/package-lock.json** workflow.

            This lockfile is required for `npm ci` in `ui/Dockerfile` to work —
            without it, both local and CI Docker builds fail at the
            `npm ci --ignore-scripts` step.

            Review and merge to fix the frontend build.
          branch: bootstrap/ui-package-lock
          add-paths: ui/package-lock.json

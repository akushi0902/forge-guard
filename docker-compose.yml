# ForgeGuard — Docker Compose stack
#
# Prerequisites:
#   - Docker Compose v2.20+ (required for depends_on service_completed_successfully)
#   - .env file (copy from .env.example and fill in values)
#   - Self-signed TLS certificates in nginx/ssl/ (run: make certs)
#
# Usage:
#   make setup   # generate certs, copy .env.example → .env
#   make up      # build images and start all services
#   make logs    # tail all service logs
#   make down    # stop all services
#   make clean   # stop + remove volumes + remove local images

name: forgeguard

# --------------------------------------------------------------------------
# Shared network — all services communicate on this internal network.
# PostgreSQL port 5432 is NOT exposed to the host; only backend can reach it.
# --------------------------------------------------------------------------
networks:
  forgeguard-net:
    driver: bridge

# --------------------------------------------------------------------------
# Named volumes
# --------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local

# --------------------------------------------------------------------------
# Services
# --------------------------------------------------------------------------
services:

  # ── PostgreSQL ────────────────────────────────────────────────────────── #
  forgeguard-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forgeguard_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - forgeguard-net
    # Port 5432 is intentionally NOT exposed to the host.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-forgeguard} -d ${POSTGRES_DB:-forgeguard_dev}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ── Alembic migration runner ──────────────────────────────────────────── #
  forgeguard-migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: /app/src
    networks:
      - forgeguard-net
    depends_on:
      forgeguard-db:
        condition: service_healthy
    # Migration must exit 0 for the backend to start.
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ── FastAPI backend ───────────────────────────────────────────────────── #
  forgeguard-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FORGE_CATALOG_URL: ${FORGE_CATALOG_URL:-https://forge.example.com/catalog}
      PYTHONPATH: /app/src
    networks:
      - forgeguard-net
    depends_on:
      forgeguard-migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8000/api/v1/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Nginx + React SPA frontend ────────────────────────────────────────── #
  forgeguard-frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Mount the reverse-proxy Nginx config (with TLS + API proxy) over the
      # static-file-only config baked into the image.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/forgeguard.conf:ro
      # Mount self-signed certs generated by scripts/generate-dev-certs.sh
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - forgeguard-net
    depends_on:
      forgeguard-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost/ -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

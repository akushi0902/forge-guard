# ForgeGuard — Nginx reverse proxy configuration
#
# This config is mounted into the forgeguard-frontend container by
# docker-compose.yml, overriding the simple static-file config baked
# into the image by ui/Dockerfile.
#
# Responsibilities:
#   - TLS termination (self-signed cert for local dev)
#   - HTTP → HTTPS redirect
#   - Reverse proxy for /api/ → forgeguard-backend:8000
#   - SPA fallback routing for React Router
#   - Security headers on all responses

# --------------------------------------------------------------------------
# HTTP → HTTPS redirect
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }

    # Allow direct health probe on plain HTTP for container orchestrators
    # that cannot use HTTPS (e.g. load balancer health checks).
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}

# --------------------------------------------------------------------------
# HTTPS — TLS termination, security headers, API proxy, SPA routing
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ---- TLS ----------------------------------------------------------- #
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Security headers ---------------------------------------------- #
    # Applied to ALL responses from this server block.
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options       "nosniff"                              always;
    add_header X-Frame-Options              "DENY"                                 always;
    add_header X-XSS-Protection            "0"                                    always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # ---- Gzip compression ---------------------------------------------- #
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ---- Backend API proxy --------------------------------------------- #
    # All requests under /api/ are forwarded to the FastAPI backend.
    # The full path is preserved so the backend receives /api/v1/... paths.
    location /api/ {
        proxy_pass         http://forgeguard-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;

        # Timeouts suitable for long-running AI scoring requests.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    30s;

        # Disable buffering for streaming responses (WebSocket / SSE).
        proxy_buffering off;

        # Custom 502 page if backend is unreachable.
        error_page 502 /502.json;
    }

    # ---- 502 error response -------------------------------------------- #
    location = /502.json {
        internal;
        return 502 '{"error":"backend_unavailable","message":"The ForgeGuard backend is temporarily unavailable. Please try again shortly."}';
        add_header Content-Type application/json always;
    }

    # ---- React SPA static assets --------------------------------------- #
    # Hashed filenames (Vite output) are cached aggressively.
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root    /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- React SPA fallback -------------------------------------------- #
    # All other requests serve index.html so React Router handles routing.
    location / {
        root      /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

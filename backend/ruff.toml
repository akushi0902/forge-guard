# Ruff configuration for ForgeGuard backend
# https://docs.astral.sh/ruff/configuration/

target-version = "py312"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line-length — handled by formatter
    "B008",   # do not perform function calls in default argument (FastAPI Depends pattern)
    "RUF012", # mutable class attributes — acceptable in Pydantic models
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is fine in tests
    "ANN",     # type annotations not required in tests
    "D",       # docstrings not required in tests
    "SIM117",  # nested with statements are fine in tests
]
"**/alembic/**/*.py" = [
    "INP001",  # alembic versions are not part of a package
    "D",       # docstrings not required in migration scripts
]

[lint.isort]
known-first-party = ["forgeguard"]
force-sort-within-sections = true

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[build-system]
requires = ["setuptools>=70", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeguard"
version = "0.1.0"
description = "AI-powered Engineering Governance and Release Readiness platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "structlog>=24.0",
    "prometheus-client>=0.20",
    "cryptography>=42.0",
    "PyYAML>=6.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "import-linter>=2.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
    "factory-boy>=3.3",
    "Faker>=26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -v"
markers = [
    "unit: Unit tests — no database or external services required",
    "integration: Integration tests — require a running PostgreSQL container (Docker)",
    "compliance: Compliance tests — verify audit trail and data retention requirements",
]

[tool.coverage.run]
# Coverage measured over the whole forgeguard package.
# For the 80% gate on critical modules, CI runs:
#   pytest --cov --cov-fail-under=80 --cov-include="*/services/policy_guardian/*,..."
source = ["src/forgeguard"]
branch = true
omit = [
    "*/alembic/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
# fail_under is intentionally 0 here — coverage threshold is a SEPARATE CI gate
# step so it never blocks the full test suite. Use --cov-fail-under=80 in the
# CI quality gate that targets services/policy_guardian, services/release_guardian,
# services/decision_engine, and services/audit modules.
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.paths]
# Maps install paths back to the source tree for combined reports.
source = [
    "src/forgeguard",
    "*/site-packages/forgeguard",
]
